<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrum Prep</title>
  <meta name="description" content="Exam study notes for Scrum Project Management: chapters, glossary, flashcards and self-test Q&A.">
  <meta name="theme-color" content="#07090d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2367e8f9'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='%2307090d'/><path d='M9 21a7 7 0 1 1 13.5-2.6' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linecap='round'/><path d='M22.5 14v5h-5' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    try { if (localStorage.getItem("selftest") === "1") document.documentElement.classList.add("selftest"); } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open contents" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/home"><span class="brand-dot"></span>Scrum<span class="brand-thin">Prep</span></a>

    <button class="search-trigger" id="paletteBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="st-label">Search notes, terms, sections</span>
      <kbd id="kbdHint">⌘K</kbd>
    </button>

    <div class="top-actions">
      <button class="chip-toggle" id="selfTestBtn" aria-pressed="false" title="Hide answers in Q&A sections so you can test yourself">
        <span class="switch"><span></span></span><span class="ct-label">Self-test</span>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="nav" aria-label="Contents"></nav>
      <div class="side-foot">
        <div class="legend">
          <span class="pill hy">High-yield</span><span class="pill imp">Important</span>
          <span class="src fac">Slides</span><span class="src txt">Textbook</span>
        </div>
        <div class="side-progress" id="sideProgress"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="content" id="main">
      <div id="view"></div>
      <nav class="pager" id="pager" aria-label="Previous and next"></nav>
    </main>

    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </div>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="paletteInput" type="text" placeholder="Search chapters, sections, definitions, or any text…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>/</kbd> or <kbd>⌘K</kbd> anywhere</span></div>
    </div>
  </div>

  <button class="icon-btn to-top" id="toTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="assets/marked.min.js"></script>
  <script src="assets/notes.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
